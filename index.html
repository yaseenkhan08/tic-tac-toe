<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Tic Tac Toe: You vs AI</title>
  <style>
    * {
      box-sizing: border-box;
      font-family: 'Segoe UI', sans-serif;
      margin: 0;
      padding: 0;
    }

    body {
      background: linear-gradient(135deg, #1e1e2f, #0f0f1c);
      color: white;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      overflow: hidden;
    }

    .game-container {
      background: rgba(255, 255, 255, 0.05);
      border-radius: 20px;
      padding: 30px;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.37);
      backdrop-filter: blur(10px);
      text-align: center;
    }

    h1 {
      margin-bottom: 20px;
      font-size: 2.5rem;
      color: #00ffea;
    }

    .board {
      display: grid;
      grid-template-columns: repeat(3, 100px);
      grid-gap: 10px;
      margin: 20px 0;
      justify-content: center;
    }

    .cell {
      width: 100px;
      height: 100px;
      background: rgba(255, 255, 255, 0.1);
      border-radius: 15px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 2.5rem;
      cursor: pointer;
      transition: background 0.3s;
    }

    .cell:hover {
      background: rgba(255, 255, 255, 0.2);
    }

    .cell.taken {
      cursor: default;
      color: #fff;
    }

    .status {
      font-size: 1.2rem;
      margin: 10px 0 20px;
      min-height: 1.5rem;
    }

    .btn {
      background: #00ffea;
      border: none;
      padding: 10px 20px;
      color: #000;
      font-weight: bold;
      border-radius: 8px;
      cursor: pointer;
      margin-top: 10px;
      transition: background 0.3s;
    }

    .btn:hover {
      background: #00e0cb;
    }

    .fade-in {
      animation: fadeIn 0.8s ease-in-out;
    }

    @keyframes fadeIn {
      from {opacity: 0; transform: scale(0.95);}
      to {opacity: 1; transform: scale(1);}
    }
  </style>
</head>
<body>

<div class="game-container fade-in">
  <h1>Tic Tac Toe</h1>
  <div class="status">Click "Start Game" to begin</div>
  <div class="board" id="board"></div>
  <button class="btn" id="startBtn">Start Game</button>
</div>

<script>
  const boardEl = document.getElementById('board');
  const statusEl = document.querySelector('.status');
  const startBtn = document.getElementById('startBtn');
  let board = [];
  let isGameOver = false;

  const winningCombos = [
    [0,1,2],[3,4,5],[6,7,8], // rows
    [0,3,6],[1,4,7],[2,5,8], // cols
    [0,4,8],[2,4,6]          // diagonals
  ];

  function initBoard() {
    board = Array(9).fill('');
    boardEl.innerHTML = '';
    isGameOver = false;
    statusEl.textContent = "Your turn (X)";
    for (let i = 0; i < 9; i++) {
      const cell = document.createElement('div');
      cell.classList.add('cell');
      cell.dataset.index = i;
      cell.addEventListener('click', onPlayerMove);
      boardEl.appendChild(cell);
    }
  }

  function onPlayerMove(e) {
    const idx = e.target.dataset.index;
    if (board[idx] === '' && !isGameOver) {
      makeMove(idx, 'X');
      const result = checkWinner();
      if (result) endGame(result);
      else {
        statusEl.textContent = "Computer's turn (O)";
        setTimeout(() => {
          computerMove();
          const result2 = checkWinner();
          if (result2) endGame(result2);
          else statusEl.textContent = "Your turn (X)";
        }, 500);
      }
    }
  }

  function makeMove(idx, symbol) {
    board[idx] = symbol;
    const cell = boardEl.querySelector(`[data-index="${idx}"]`);
    cell.textContent = symbol;
    cell.classList.add('taken');
  }

  function computerMove() {
    const emptyIndices = board
      .map((val, idx) => val === '' ? idx : null)
      .filter(idx => idx !== null);

    if (emptyIndices.length === 0) return;

    // Simple AI: randomly pick from empty cells
    const move = emptyIndices[Math.floor(Math.random() * emptyIndices.length)];
    makeMove(move, 'O');
  }

  function checkWinner() {
    for (let combo of winningCombos) {
      const [a, b, c] = combo;
      if (board[a] && board[a] === board[b] && board[b] === board[c]) {
        return board[a] + " wins!";
      }
    }
    if (!board.includes('')) return "It's a draw!";
    return null;
  }

  function endGame(message) {
    statusEl.textContent = message;
    isGameOver = true;
  }

  startBtn.addEventListener('click', initBoard);
</script>

</body>
</html>
