<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Stunning Tic Tac Toe</title>
  <style>
    body {
      margin: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(to right, #4facfe, #00f2fe);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: start;
      min-height: 100vh;
      padding: 20px;
    }

    h1 {
      color: #fff;
      text-shadow: 2px 2px #000;
    }

    .ad-slot {
      margin: 10px 0;
    }

    .board {
      display: grid;
      grid-template-columns: repeat(3, 100px);
      grid-template-rows: repeat(3, 100px);
      gap: 10px;
      margin: 20px 0;
    }

    .cell {
      background-color: #fff;
      border-radius: 10px;
      font-size: 2.5rem;
      color: #333;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: transform 0.2s;
    }

    .cell:hover {
      transform: scale(1.05);
    }

    .message {
      margin: 20px;
      font-size: 1.2rem;
      color: #fff;
      background: rgba(0, 0, 0, 0.2);
      padding: 10px 20px;
      border-radius: 8px;
    }

    .start-button {
      padding: 10px 20px;
      font-size: 1rem;
      background-color: #fff;
      color: #0077ff;
      border: none;
      border-radius: 5px;
      cursor: pointer;
      margin: 15px;
    }

    .start-button:hover {
      background-color: #f0f0f0;
    }

    .floating-ad {
      position: fixed;
      right: 0;
      bottom: 20%;
      z-index: 999;
    }
  </style>
</head>
<body>

  <h1>Tic Tac Toe</h1>

  <!-- ✅ Ad #1 - Top of Page -->
  <div class="ad-slot">
    <script type="text/javascript">
      atOptions = {
        'key' : 'e1d9d5c57c7d640baea990658b12a161',
        'format' : 'iframe',
        'height' : 50,
        'width' : 320,
        'params' : {}
      };
    </script>
    <script type="text/javascript" src="//www.highperformanceformat.com/e1d9d5c57c7d640baea990658b12a161/invoke.js"></script>
  </div>

  <!-- ✅ Ad #2 - Inside Game Start Area -->
  <button class="start-button" onclick="startGame()">Start Game</button>
  <div class="ad-slot">
    <script type="text/javascript">
      atOptions = {
        'key' : 'e1d9d5c57c7d640baea990658b12a161',
        'format' : 'iframe',
        'height' : 50,
        'width' : 320,
        'params' : {}
      };
    </script>
    <script type="text/javascript" src="//www.highperformanceformat.com/e1d9d5c57c7d640baea990658b12a161/invoke.js"></script>
  </div>

  <div class="board" id="board">
    <!-- 9 cells dynamically created -->
  </div>

  <!-- ✅ Ad #3 - Below Game Board -->
  <div class="ad-slot">
    <script type="text/javascript">
      atOptions = {
        'key' : 'e1d9d5c57c7d640baea990658b12a161',
        'format' : 'iframe',
        'height' : 50,
        'width' : 320,
        'params' : {}
      };
    </script>
    <script type="text/javascript" src="//www.highperformanceformat.com/e1d9d5c57c7d640baea990658b12a161/invoke.js"></script>
  </div>

  <div class="message" id="message">Click "Start Game" to begin.</div>

  <!-- ✅ Ad #4 - Bottom -->
  <div class="ad-slot">
    <script type="text/javascript">
      atOptions = {
        'key' : 'e1d9d5c57c7d640baea990658b12a161',
        'format' : 'iframe',
        'height' : 50,
        'width' : 320,
        'params' : {}
      };
    </script>
    <script type="text/javascript" src="//www.highperformanceformat.com/e1d9d5c57c7d640baea990658b12a161/invoke.js"></script>
  </div>

  <!-- ✅ Ad #5 - Floating Right Side -->
  <div class="floating-ad">
    <script type="text/javascript">
      atOptions = {
        'key' : 'e1d9d5c57c7d640baea990658b12a161',
        'format' : 'iframe',
        'height' : 50,
        'width' : 320,
        'params' : {}
      };
    </script>
    <script type="text/javascript" src="//www.highperformanceformat.com/e1d9d5c57c7d640baea990658b12a161/invoke.js"></script>
  </div>

  <script>
    let board = [];
    let currentPlayer = "X";
    let isGameOver = false;

    function startGame() {
      board = Array(9).fill("");
      isGameOver = false;
      currentPlayer = "X";
      const boardElement = document.getElementById("board");
      boardElement.innerHTML = "";
      document.getElementById("message").textContent = "Your turn (X).";

      for (let i = 0; i < 9; i++) {
        const cell = document.createElement("div");
        cell.classList.add("cell");
        cell.addEventListener("click", () => makeMove(i, cell));
        boardElement.appendChild(cell);
      }
    }

    function makeMove(index, cell) {
      if (board[index] !== "" || isGameOver || currentPlayer !== "X") return;

      board[index] = "X";
      cell.textContent = "X";
      checkGameStatus();

      if (!isGameOver) {
        currentPlayer = "O";
        setTimeout(computerMove, 500);
      }
    }

    function computerMove() {
      let emptyIndices = board.map((val, i) => val === "" ? i : null).filter(i => i !== null);
      if (emptyIndices.length === 0) return;

      let randomIndex = emptyIndices[Math.floor(Math.random() * emptyIndices.length)];
      board[randomIndex] = "O";
      document.querySelectorAll(".cell")[randomIndex].textContent = "O";
      checkGameStatus();

      if (!isGameOver) {
        currentPlayer = "X";
        document.getElementById("message").textContent = "Your turn (X).";
      }
    }

    function checkGameStatus() {
      const winningCombos = [
        [0,1,2], [3,4,5], [6,7,8],
        [0,3,6], [1,4,7], [2,5,8],
        [0,4,8], [2,4,6]
      ];

      for (let combo of winningCombos) {
        const [a, b, c] = combo;
        if (board[a] && board[a] === board[b] && board[a] === board[c]) {
          isGameOver = true;
          document.getElementById("message").textContent = `${board[a]} wins!`;
          return;
        }
      }

      if (!board.includes("")) {
        isGameOver = true;
        document.getElementById("message").textContent = "It's a draw!";
      }
    }
  </script>
</body>
</html>
